name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  validate:
    name: Structural validation
    runs-on: ubuntu-latest
    steps:
      # Pinned to full commit SHA for supply-chain integrity (immutable, unlike tag v5).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Validate structure
        run: node scripts/validate.mjs

      - name: Eval consistency
        run: node scripts/eval.mjs

      - name: Trigger-eval floor (skill descriptions)
        run: node scripts/trigger-eval.mjs

      - name: Ticket-graph validator self-test
        run: node scripts/tickets.test.mjs

      - name: Doctor corrective-tier self-test
        run: node scripts/doctor.test.mjs

      - name: Mandatory-gate classifier self-test
        run: node scripts/mandatory-gate.test.mjs

      - name: Action-gate self-test
        run: node scripts/action-gate.test.mjs

      - name: TNA veto gate self-test
        run: node scripts/tna-gate.test.mjs

      - name: TNA veto V2 adapter self-test
        run: node scripts/tna-gate-v2.test.mjs

      - name: TNA evidence store self-test
        run: node scripts/tna-store.test.mjs

      - name: TNA veto portability self-test
        run: node scripts/tna-portable.test.mjs

      - name: Gate meter self-test
        run: node scripts/gate-meter.test.mjs

      - name: First-run gate self-test
        run: node scripts/first-run.test.mjs

      - name: Eval adapter pins self-test
        run: node scripts/eval-adapter.test.mjs

      - name: Autonomy ladder self-test
        run: node scripts/autonomy-ladder.test.mjs

      - name: Stale-memory probe self-test
        run: node scripts/stale-probe.test.mjs

      - name: Local judge self-test
        run: node scripts/local-judge.test.mjs

      - name: Overlay registry self-test
        run: node scripts/overlay-registry.test.mjs

      - name: Spec scrub self-test
        run: node scripts/spec-scrub.test.mjs

      - name: Floor composer self-test
        run: node scripts/floor-composer.test.mjs

      - name: Onboarding seam self-test
        run: node scripts/onboarding.test.mjs

      - name: Receipt enforcement self-test
        run: node scripts/receipt-enforcement.test.mjs

      - name: Ledger audit self-test
        run: node scripts/ledger-audit.test.mjs

      - name: Ticket-graph validator smoke
        # The CLI gates on tickets validated, not directories found: a run over
        # zero tickets exits 1. A fresh checkout has no .trust/ (gitignored), so
        # a bare invocation would always fail here — validate the committed
        # fixture instead, which also proves the happy path end-to-end. The
        # negative contracts live in scripts/tickets.test.mjs (step above).
        run: node scripts/tickets.mjs scripts/tickets-fixture/issues

      - name: Site acceptance contract
        run: node scripts/site.test.mjs

      - name: Hook entry-point contract (fail-open)
        run: node scripts/gate-hook.test.mjs

      - name: Plugin mirror drift guard
        run: node scripts/plugin.test.mjs
      - name: Codex plugin payload guard
        run: node scripts/codex-plugin.test.mjs
      - name: Marketplace + Copilot payload
        run: node scripts/marketplace-copilot.test.mjs
      - name: File token budget guard
        run: node scripts/file-budget.test.mjs
      - name: Payload sync (zero drift by discovery)
        run: node scripts/payload-sync.test.mjs

      - name: Changelog structure guard
        run: node scripts/changelog-guard.test.mjs

      # The workflow guard runs here too: a workflow file GitHub cannot BUILD
      # never reports a normal failure, so nothing else in this job would notice
      # (v0.1.25/v0.1.26: every run failed at 0s, "workflow file issue", no logs).
      - name: Workflow file guard
        run: node scripts/ci-guard.mjs

      - name: Workflow file guard self-test
        run: node scripts/ci-guard.test.mjs

      # The file budget RATCHET. Before 2026-11-03 the budget guard was opt-in
      # and wired nowhere, so this repo accumulated 80 over-budget files while
      # every gate stayed green (docs/compatibility.md known limit 4). The
      # baseline pins each existing offender's size as a CEILING: `--all` plus
      # the baseline means an offender may shrink but never grow, and a NEW
      # offender fails here. Without `--all` the job would only see the staged
      # delta, which is exactly the blind spot that let the 80 accumulate.
      - name: File budget ratchet
        run: node scripts/file-budget.mjs --all

      - name: File budget ratchet self-test
        run: node scripts/file-budget.test.mjs

      # The Codex recorder verdict is OPEN in docs/compatibility.md (measured
      # dead on 0.163.0; the 0.166.0 re-probe was blocked on credentials). The
      # probe SHAPE now lives in a script so it cannot be forgotten: its test
      # asserts the verdict/exit-code mapping in every credential state, and it
      # reports "UNPROVEN" (exit 3) rather than guessing when Codex cannot run.
      - name: Codex recorder re-probe self-test
        run: node scripts/codex-reprobe.test.mjs

      # ---- Suites that were tracked but never invoked (2026-11-03 audit) ----
      # 19 of 48 `scripts/*.test.mjs` files appeared in no job: a test file that
      # CI never runs is a comment with a shebang, and every harness gate in the
      # list below was in that state. `ci-guard.mjs` M8 now derives this list
      # from the filesystem and fails when ANY suite is unwired, so this block is
      # the second half of the same boundary (the first half would have caught a
      # future unwired file even if a contributor forgot this step).
      - name: Adapter parity (pi / omp / dsh grammar vs the canonical gate)
        run: node scripts/veto-adapter.test.mjs

      - name: Veto tool coverage
        run: node scripts/veto-tool-coverage.test.mjs

      - name: dsh veto adapter
        run: node scripts/dsh-veto.test.mjs

      - name: dsh discipline hooks
        run: node scripts/dsh-discipline.test.mjs

      - name: dsh fix-list regression suite
        run: node scripts/dsh-fixlist.test.mjs

      - name: omp fix-list regression suite
        run: node scripts/omp-fixlist.test.mjs

      - name: pi discipline hooks
        run: node scripts/pi-discipline.test.mjs

      - name: pi recorder
        run: node scripts/pi-recorder.test.mjs

      - name: Harness-general regressions (manifest wiring, doctor, install)
        run: node scripts/harness-general.test.mjs

      - name: Router re-injection
        run: node scripts/reinject.test.mjs

      - name: Doctor adapter verdicts
        run: node scripts/doctor-adapter.test.mjs

      - name: Behavioral eval harness
        run: node scripts/behavioral-eval.test.mjs

      - name: Onboarding layers
        run: node scripts/onboarding-layers.test.mjs

      - name: Onboarding refresh
        run: node scripts/onboarding-refresh.test.mjs

      - name: Evidence recorder door
        run: node scripts/record-evidence.test.mjs

      - name: Recorder runners
        run: node scripts/recorder-runners.test.mjs

      - name: Update check
        run: node scripts/update-check.test.mjs

      - name: Update delivery
        run: node scripts/update-delivery.test.mjs

      - name: Update install
        run: node scripts/update-install.test.mjs

  hooks:
    name: Git hooks gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      # The hooks rot silently when nothing exercises them (audit finding P8).
      # A contributor activates them with `git config core.hooksPath scripts/hooks`
      # (README → Contributing); this job reproduces that exact setup on a local
      # clone and proves a valid commit passes both hooks while a non-conventional
      # message is rejected by commit-msg.
      - name: Exercise hooks on a scratch commit
        run: |
          set -eux
          git clone --quiet . "$RUNNER_TEMP/hook-test"
          git -C "$RUNNER_TEMP/hook-test" config user.email ci@example.com
          git -C "$RUNNER_TEMP/hook-test" config user.name CI
          git -C "$RUNNER_TEMP/hook-test" config core.hooksPath scripts/hooks
          # valid conventional message must pass both hooks
          git -C "$RUNNER_TEMP/hook-test" commit --allow-empty -m "chore(test): valid commit passes the hooks"
          # non-conventional message must be rejected by commit-msg
          if git -C "$RUNNER_TEMP/hook-test" commit --allow-empty -m "not a conventional message"; then
            echo "expected commit-msg rejection, but commit succeeded" >&2
            exit 1
          fi
          echo "hooks gate: PASS"

  windows:
    name: Validate on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Validate structure
        run: node scripts/validate.mjs

      - name: Eval consistency
        run: node scripts/eval.mjs

      - name: Ticket-graph validator self-test
        run: node scripts/tickets.test.mjs

      - name: Doctor corrective-tier self-test
        run: node scripts/doctor.test.mjs
